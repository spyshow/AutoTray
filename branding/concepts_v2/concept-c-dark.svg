<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-sym-c">
  <title id="title-sym-c">AutoTray-Router — Concept C: Tray Cross-Section Sizing</title>
  
  <!-- Heavy-Duty U-Profile Cable Tray Body with Return Flanges -->
  <path fill="#CBD5E1" fill-rule="evenodd" d="
    M 32 68
    H 60
    V 84
    H 48
    V 184
    H 208
    V 84
    H 196
    V 68
    H 224
    V 200
    H 32
    Z
  "/>

  <!-- Central Metallic Segregation Barrier (NEC 392 Separator Plate) -->
  <path fill="#CBD5E1" d="
    M 122 80
    H 134
    V 184
    H 122
    Z
  "/>

  <!-- Left Compartment: Power Cables (Single-layer spaced with copper cores) -->
  <!-- Power Cable 1 -->
  <circle cx="68" cy="154" r="20" fill="#3B82F6"/>
  <circle cx="68" cy="154" r="8" fill="#93C5FD"/>
  <!-- Power Cable 2 -->
  <circle cx="102" cy="162" r="12" fill="#3B82F6"/>
  <circle cx="102" cy="162" r="5" fill="#93C5FD"/>

  <!-- Right Compartment: Control & Data Cables (Multilayer stacked pyramid) -->
  <!-- Bottom tier: 3 control cables -->
  <circle cx="152" cy="168" r="9" fill="#FF6B00"/>
  <circle cx="171" cy="168" r="9" fill="#FF6B00"/>
  <circle cx="190" cy="168" r="9" fill="#FF6B00"/>
  <!-- Middle tier: 2 cables -->
  <circle cx="161.5" cy="152" r="9" fill="#FF8C00"/>
  <circle cx="180.5" cy="152" r="9" fill="#10B981"/>
  <!-- Top tier: 1 cable -->
  <circle cx="171" cy="136" r="9" fill="#10B981"/>

  <!-- Technical Sizing Dimension Bracket (Width = 300mm Standard) -->
  <path d="M 32 216 H 224" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 210 V 222 M 224 210 V 222" stroke="#FF6B00" stroke-width="3"/>
  <path d="M 128 210 V 222" stroke="#FF6B00" stroke-width="2"/>
</svg>